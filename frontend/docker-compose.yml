name: qc-checklist-frontend
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: qc-checklist-frontend
    container_name: qc-checklist-frontend
    ports:
      - "5020:5020"
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5020"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    mem_reservation: 256m